name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17 with Central credentials and GPG signing
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: GPG_SIGNING_KEY_PASSWORD

      # Workaround for apache/maven#13388: Maven 3.10.0 (rolled out to ubuntu-latest runners)
      # makes central-publishing-maven-plugin stage local-repository bookkeeping files
      # (maven-metadata-local.xml, _remote.repositories, .locks/) into the bundle,
      # which Maven Central rejects with "Bundle has content that does NOT have a .pom file".
      - name: Pin Maven 3.9.16
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/maven.tgz
          sudo tar -xzf /tmp/maven.tgz -C /opt
          sudo ln -sf /opt/apache-maven-3.9.16/bin/mvn /usr/local/bin/mvn
          mvn -version

      - name: Build & Test
        run: mvn -B clean verify

      - name: Set release version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "Releasing version $TAG"
          mvn -B versions:set -DnewVersion=$TAG -DgenerateBackupPoms=false

      - name: Deploy to Maven Central
        run: mvn -B clean deploy -DskipTests -Pcentral
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            target/*.jar
